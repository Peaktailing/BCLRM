<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCLRM 试剂库管理系统 - 系统设置</title>
    <style id="theme-vars">
/* ================================================
   BCLRM 试剂库管理系统 - 品牌样式 (JD 风格)
   主色: 京东红 #E1251B  |  侧边栏: 深灰 #1D2129
   ================================================ */

:root {
  /* === Brand Primary === */
  --color-primary: #E1251B;
  --color-primary-hover: #C91A12;
  --color-primary-active: #A8140E;
  --color-primary-light: #FFF1F0;
  --color-primary-50: #FEF2F2;
  --color-primary-100: #FDE8E8;
  --color-primary-200: #FBC4C4;
  --color-primary-500: #E1251B;
  --color-primary-600: #C91A12;
  --color-primary-700: #A8140E;
  --color-primary-800: #8B110B;
  --color-primary-900: #6E0E08;

  /* === Neutral === */
  --color-neutral-0: #FFFFFF;
  --color-neutral-50: #F7F8FA;
  --color-neutral-100: #F2F3F5;
  --color-neutral-200: #E5E6EB;
  --color-neutral-300: #C9CDD4;
  --color-neutral-400: #86909C;
  --color-neutral-500: #4E5969;
  --color-neutral-600: #1D2129;
  --color-neutral-700: #17171A;
  --color-neutral-800: #111114;
  --color-neutral-900: #0A0A0B;

  /* === Surface & Background === */
  --color-bg-main: #F7F8FA;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-muted: #F2F3F5;
  --color-bg-sidebar: #1D2129;

  /* === Text === */
  --color-text-primary: #1D2129;
  --color-text-secondary: #4E5969;
  --color-text-tertiary: #86909C;
  --color-text-placeholder: #C9CDD4;
  --color-text-inverse: #FFFFFF;
  --color-text-brand: #E1251B;

  /* === Border === */
  --color-border: #E5E6EB;
  --color-border-light: #F2F3F5;
  --color-border-dark: #C9CDD4;

  /* === State === */
  --state-success: #00B42A;
  --state-success-bg: #E8FFEA;
  --state-warning: #FF7D00;
  --state-warning-bg: #FFF7E8;
  --state-error: #F53F3F;
  --state-error-bg: #FFECE8;
  --state-info: #0FC6C2;
  --state-info-bg: #E8FFFB;

  /* === Radius === */
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 48px;

  /* === Typography === */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "Menlo", "Consolas", monospace;

  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 28px;
  --text-5xl: 32px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.75;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* === Layout === */
  --sidebar-width: 220px;
  --header-height: 56px;
  --content-max-width: 1400px;
}

/* === Dark Mode === */
html.dark {
  --color-bg-main: #0A0A0B;
  --color-bg-surface: #17171A;
  --color-bg-elevated: #1D2129;
  --color-bg-muted: #24272E;
  --color-bg-sidebar: #0A0A0B;

  --color-text-primary: #F2F3F5;
  --color-text-secondary: #C9CDD4;
  --color-text-tertiary: #86909C;
  --color-text-placeholder: #4E5969;
  --color-text-inverse: #1D2129;

  --color-border: #24272E;
  --color-border-light: #1D2129;
  --color-border-dark: #4E5969;

  --color-primary-light: #2A1515;
  --color-primary-50: #1D0F0E;

  --state-success-bg: #0D2818;
  --state-warning-bg: #2B1D0A;
  --state-error-bg: #2B1010;
  --state-info-bg: #0D2222;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.15);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: #ffffff; color: #0f172a; }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <!-- Mobile sidebar overlay backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="document.getElementById('sidebar').classList.add('-translate-x-full'); this.classList.add('hidden');"></div>

  <!-- Left Sidebar -->
  <aside id="sidebar"
    class="fixed top-0 left-0 z-50 h-full flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200"
    style="width: var(--sidebar-width); background-color: var(--color-bg-sidebar);">

    <!-- Logo Area -->
    <div class="flex items-center gap-2.5 px-5 py-4 shrink-0" style="border-bottom: 1px solid rgba(255,255,255,0.08);">
      <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; background-color: var(--color-primary); border-radius: var(--radius-md);">
        <i data-lucide="flask-conical" style="width: 18px; height: 18px; color: var(--color-text-inverse);"></i>
      </div>
      <div class="min-w-0">
        <div class="truncate text-base font-semibold tracking-wide" style="color: var(--color-text-inverse); font-family: var(--font-sans);">BCLRM</div>
        <div class="truncate text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-sans);">试剂库管理系统</div>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto py-3 px-2">
      <ul class="flex flex-col gap-0.5">

        <!-- 首页 -->
        <li>
          <a href="#home" data-nav-key="home" data-dom-id="nav-home"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="home" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">首页</span>
          </a>
        </li>

        <!-- 实时库存 -->
        <li>
          <a href="#inventory" data-nav-key="inventory" data-dom-id="nav-inventory"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="package" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">实时库存</span>
          </a>
        </li>

        <!-- 试剂入库 -->
        <li>
          <a href="#stock-in" data-nav-key="stock-in" data-dom-id="nav-stock-in"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="plus-circle" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">试剂入库</span>
          </a>
        </li>

        <!-- 领用归还 -->
        <li>
          <a href="#borrow-return" data-nav-key="borrow-return" data-dom-id="nav-borrow-return"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="arrow-right-left" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">领用归还</span>
          </a>
        </li>

        <!-- 综合查询 -->
        <li>
          <a href="#query" data-nav-key="query" data-dom-id="nav-query"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="search" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">综合查询</span>
          </a>
        </li>

        <!-- 数据看板 -->
        <li>
          <a href="#dashboard" data-nav-key="dashboard" data-dom-id="nav-dashboard"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="bar-chart-3" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">数据看板</span>
          </a>
        </li>

        <!-- 化学品信息 -->
        <li>
          <a href="#chemical-info" data-nav-key="chemical-info" data-dom-id="nav-chemical-info"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="flask-conical" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">化学品信息</span>
          </a>
        </li>

        <!-- 管控化学品目录 -->
        <li>
          <a href="#controlled-list" data-nav-key="controlled-list" data-dom-id="nav-controlled-list"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-tertiary); border-left: 3px solid transparent;"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="shield-alert" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">管控化学品目录</span>
          </a>
        </li>

        <!-- 系统设置 (Active) -->
        <li>
          <a href="#settings" data-nav-key="settings" data-dom-id="nav-settings" data-active="true"
            class="nav-active group flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors duration-150 cursor-pointer"
            style="color: var(--color-text-inverse); border-left: 3px solid var(--color-primary); background-color: rgba(255,255,255,0.08);"
            onmouseenter="if(!this.classList.contains('nav-active'))this.style.backgroundColor='rgba(255,255,255,0.06)'"
            onmouseleave="if(!this.classList.contains('nav-active'))this.style.backgroundColor='transparent'">
            <i data-lucide="settings" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
            <span class="truncate text-sm" style="font-family: var(--font-sans);">系统设置</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Version -->
    <div class="shrink-0 px-5 py-3" style="border-top: 1px solid rgba(255,255,255,0.08);">
      <span class="text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-sans);">v0.2.0</span>
    </div>
  </aside>

  <!-- Main Layout Wrapper -->
  <div id="main-wrapper" class="flex flex-col min-h-screen lg:ml-[var(--sidebar-width)]">

    <!-- Top Header Bar -->
    <header class="sticky top-0 z-30 flex items-center justify-between shrink-0 px-4 lg:px-6"
      style="height: var(--header-height); background-color: var(--color-bg-surface); border-bottom: 1px solid var(--color-border);">

      <!-- Left: Hamburger + Breadcrumb -->
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <!-- Mobile hamburger toggle -->
        <button class="lg:hidden flex items-center justify-center shrink-0 cursor-pointer"
          style="width: 36px; height: 36px; border-radius: var(--radius-md); color: var(--color-text-secondary);"
          onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-backdrop').classList.toggle('hidden');">
          <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
        </button>
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-1.5 min-w-0 text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">
          <a href="#home" data-dom-id="nav-home" class="truncate transition-colors hover:underline" style="color: var(--color-text-secondary);">首页</a>
          <i data-lucide="chevron-right" style="width: 14px; height: 14px; flex-shrink: 0;"></i>
          <span class="truncate" style="color: var(--color-text-primary);">系统设置</span>
        </nav>
      </div>

      <!-- Right: Notification + User -->
      <div class="flex items-center gap-4 shrink-0">
        <!-- Notification bell -->
        <button class="relative flex items-center justify-center cursor-pointer"
          style="width: 36px; height: 36px; border-radius: var(--radius-md); color: var(--color-text-secondary);"
          onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
          onmouseleave="this.style.backgroundColor='transparent'">
          <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
          <span class="absolute top-1 right-1 flex items-center justify-center" style="width: 8px; height: 8px; background-color: var(--color-primary); border-radius: 50%; border: 2px solid var(--color-bg-surface);"></span>
        </button>

        <!-- User avatar -->
        <div class="flex items-center gap-2 cursor-pointer py-1 px-2 rounded-md transition-colors duration-150"
          onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
          onmouseleave="this.style.backgroundColor='transparent'">
          <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; background-color: var(--color-primary); border-radius: 50%; color: var(--color-text-inverse); font-size: 13px; font-weight: 600; font-family: var(--font-sans);">
            管
          </div>
          <span class="hidden sm:inline truncate text-sm" style="color: var(--color-text-primary); font-family: var(--font-sans);">管理员</span>
          <i data-lucide="chevron-down" class="hidden sm:inline" style="width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-3 lg:p-5 min-h-0" style="background-color: var(--color-bg-main);">

      <!-- Page Title -->
      <div class="mb-4">
        <h1 class="text-xl font-bold" style="color: var(--color-text-primary); font-family: var(--font-sans);">系统设置</h1>
        <p class="text-sm mt-1" style="color: var(--color-text-secondary); font-family: var(--font-sans);">系统配置和数据管理</p>
      </div>

      <!-- Settings Layout: Left Tabs + Right Content -->
      <div class="flex gap-5" style="min-height: calc(100vh - 220px);">

        <!-- Left Settings Tab Navigation -->
        <div class="hidden lg:block shrink-0" style="width: 200px;">
          <div class="rounded-lg overflow-hidden" style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border);">
            <div class="py-1">
              <!-- 基本设置 (Active) -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-primary); background-color: rgba(239, 68, 68, 0.06); border-left: 3px solid var(--color-primary);"
                data-settings-tab="basic">
                <i data-lucide="settings" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">基本设置</span>
              </a>

              <!-- 存储管理 -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-text-secondary); border-left: 3px solid transparent;"
                onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
                onmouseleave="this.style.backgroundColor='transparent'"
                data-settings-tab="storage">
                <i data-lucide="warehouse" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">存储管理</span>
              </a>

              <!-- 供应商管理 -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-text-secondary); border-left: 3px solid transparent;"
                onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
                onmouseleave="this.style.backgroundColor='transparent'"
                data-settings-tab="supplier">
                <i data-lucide="truck" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">供应商管理</span>
              </a>

              <!-- 权限管理 -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-text-secondary); border-left: 3px solid transparent;"
                onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
                onmouseleave="this.style.backgroundColor='transparent'"
                data-settings-tab="permission">
                <i data-lucide="users" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">权限管理</span>
              </a>

              <!-- 数据备份 -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-text-secondary); border-left: 3px solid transparent;"
                onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
                onmouseleave="this.style.backgroundColor='transparent'"
                data-settings-tab="backup">
                <i data-lucide="database" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">数据备份</span>
              </a>

              <!-- 操作日志 -->
              <a href="#" class="settings-tab flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150 cursor-pointer"
                style="color: var(--color-text-secondary); border-left: 3px solid transparent;"
                onmouseenter="this.style.backgroundColor='var(--color-bg-main)'"
                onmouseleave="this.style.backgroundColor='transparent'"
                data-settings-tab="logs">
                <i data-lucide="file-text" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
                <span class="truncate text-sm" style="font-family: var(--font-sans);">操作日志</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Right Content Area -->
        <div class="flex-1 min-w-0">

          <!-- Section 1: 系统信息 -->
          <div class="rounded-lg mb-4" style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border);">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom: 1px solid var(--color-border);">
              <i data-lucide="info" style="width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0;"></i>
              <h2 class="text-base font-semibold" style="color: var(--color-text-primary); font-family: var(--font-sans);">系统信息</h2>
            </div>
            <div class="px-5 py-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 系统名称 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">系统名称</label>
                  <input type="text" value="BCLRM 试剂库管理系统" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: var(--font-sans);">
                </div>
                <!-- 版本号 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">版本号</label>
                  <input type="text" value="v0.2.0" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: var(--font-sans);">
                </div>
                <!-- 数据库类型 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">数据库类型</label>
                  <input type="text" value="SQLite" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: var(--font-sans);">
                </div>
              </div>
            </div>
          </div>

          <!-- Section 2: 通知设置 -->
          <div class="rounded-lg mb-4" style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border);">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom: 1px solid var(--color-border);">
              <i data-lucide="bell" style="width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0;"></i>
              <h2 class="text-base font-semibold" style="color: var(--color-text-primary); font-family: var(--font-sans);">通知设置</h2>
            </div>
            <div class="px-5 py-4">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                <!-- 过期预警天数 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">过期预警天数</label>
                  <input type="number" value="30" min="1"
                    class="w-full px-3 py-2 rounded-md text-sm"
                    style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);">
                </div>
                <!-- 低库存预警阈值 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">低库存预警阈值</label>
                  <input type="number" value="5" min="1"
                    class="w-full px-3 py-2 rounded-md text-sm"
                    style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);">
                </div>
                <!-- 启用过期通知 -->
                <div class="flex items-center justify-between">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">启用过期通知</label>
                  <div class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked class="sr-only peer">
                    <div class="w-10 h-5 rounded-full transition-colors duration-200 peer-checked:after:translate-x-5 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-transform after:shadow-sm"
                      style="background-color: var(--color-border);"
                      onclick="this.style.backgroundColor = this.previousElementSibling.checked ? 'var(--color-border)' : 'var(--color-primary)'; this.previousElementSibling.checked = !this.previousElementSibling.checked;">
                    </div>
                  </div>
                </div>
                <!-- 启用低库存通知 -->
                <div class="flex items-center justify-between">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">启用低库存通知</label>
                  <div class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked class="sr-only peer">
                    <div class="w-10 h-5 rounded-full transition-colors duration-200 peer-checked:after:translate-x-5 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-transform after:shadow-sm"
                      style="background-color: var(--color-primary);"
                      onclick="this.style.backgroundColor = this.previousElementSibling.checked ? 'var(--color-border)' : 'var(--color-primary)'; this.previousElementSibling.checked = !this.previousElementSibling.checked;">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Section 3: 默认值配置 -->
          <div class="rounded-lg mb-4" style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border);">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom: 1px solid var(--color-border);">
              <i data-lucide="rotate-ccw" style="width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0;"></i>
              <h2 class="text-base font-semibold" style="color: var(--color-text-primary); font-family: var(--font-sans);">默认值配置</h2>
            </div>
            <div class="px-5 py-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 默认计量单位 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">默认计量单位</label>
                  <select class="w-full px-3 py-2 rounded-md text-sm cursor-pointer"
                    style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);">
                    <option value="瓶" selected>瓶</option>
                    <option value="g">g</option>
                    <option value="mL">mL</option>
                    <option value="L">L</option>
                    <option value="kg">kg</option>
                  </select>
                </div>
                <!-- 默认存储位置 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">默认存储位置</label>
                  <select class="w-full px-3 py-2 rounded-md text-sm cursor-pointer"
                    style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);">
                    <option value="常温A区" selected>常温A区</option>
                    <option value="常温B区">常温B区</option>
                    <option value="冷藏区">冷藏区</option>
                    <option value="冷冻区">冷冻区</option>
                    <option value="危险品柜">危险品柜</option>
                  </select>
                </div>
                <!-- 默认页面大小 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">默认页面大小</label>
                  <select class="w-full px-3 py-2 rounded-md text-sm cursor-pointer"
                    style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);">
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- Section 4: 数据库管理 -->
          <div class="rounded-lg mb-4" style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border);">
            <div class="flex items-center gap-2 px-5 py-3" style="border-bottom: 1px solid var(--color-border);">
              <i data-lucide="database" style="width: 18px; height: 18px; color: var(--color-primary); flex-shrink: 0;"></i>
              <h2 class="text-base font-semibold" style="color: var(--color-text-primary); font-family: var(--font-sans);">数据库管理</h2>
            </div>
            <div class="px-5 py-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <!-- 数据库路径 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">数据库路径</label>
                  <input type="text" value="db/reagent.db" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: 'Courier New', monospace;">
                </div>
                <!-- 数据库大小 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">数据库大小</label>
                  <input type="text" value="12.8 MB" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: var(--font-sans);">
                </div>
                <!-- 表数量 -->
                <div class="flex flex-col gap-1.5">
                  <label class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-sans);">表数量</label>
                  <input type="text" value="13" readonly
                    class="w-full px-3 py-2 rounded-md text-sm truncate cursor-not-allowed"
                    style="background-color: var(--color-bg-main); border: 1px solid var(--color-border); color: var(--color-text-tertiary); font-family: var(--font-sans);">
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-colors duration-150 cursor-pointer"
                  style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);"
                  onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                  onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-primary)'">
                  <i data-lucide="database" style="width: 16px; height: 16px;"></i>
                  备份数据库
                </button>
                <button class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-colors duration-150 cursor-pointer"
                  style="background-color: var(--color-bg-surface); border: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-sans);"
                  onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                  onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-primary)'">
                  <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
                  清理日志
                </button>
              </div>
            </div>
          </div>

          <!-- Save Button Area -->
          <div class="flex justify-end">
            <button class="inline-flex items-center gap-2 px-5 py-2.5 rounded-md text-sm font-medium transition-colors duration-150 cursor-pointer"
              style="background-color: var(--color-primary); color: var(--color-text-inverse); font-family: var(--font-sans);"
              onmouseenter="this.style.backgroundColor='#dc2626'"
              onmouseleave="this.style.backgroundColor='var(--color-primary)'">
              <i data-lucide="save" style="width: 16px; height: 16px;"></i>
              保存设置
            </button>
          </div>

        </div>
      </div>

    </main>

  </div>

  <style>
    .nav-active {
      color: var(--color-text-inverse) !important;
      background-color: rgba(255,255,255,0.08) !important;
      border-left-color: var(--color-primary) !important;
    }
  </style>

  <script>lucide.createIcons();</script>
</body>
</html>
